# Heavy validation belongs in Cloud Build because the local workstation is
# not reliable under sustained CPU load.  The production image is emitted
# only after the complete test suite succeeds.
steps:
  - name: python:3.11-slim
    id: full-test-suite
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git jq libgomp1
        pip install --no-cache-dir '.[gcp,app,dev]'
        PYTHONPATH=src pytest
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_IMAGE}'
      - .
  - name: gcr.io/cloud-builders/docker
    id: smoke-atlas-mvp-runner
    entrypoint: bash
    env:
      - 'IMG=${_IMAGE}'
    args:
      - -ceu
      - |
        docker run --rm "$$IMG" \
          python scripts/run_atlas_matched_diversity_mvp.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_atlas_historical_score_diagnostic.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_atlas_historical_score_diagnostic_v3.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_atlas_historical_score_diagnostic_v4.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_constraint_lattice_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/aggregate_constraint_lattice_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_constraint_lattice_support_census.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/aggregate_constraint_lattice_support_census.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_constraint_lattice_resource_preflight.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_recourse_aware_initial_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/aggregate_recourse_aware_initial_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_coherent_market_state_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/aggregate_coherent_market_state_scorefree.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_coherent_market_state_historical_score.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_production_law_dependence_source_lock.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_production_law_dependence_remeasurement.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_a2a_rank_factor_split_census.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_a2a_production_law_dependence_remeasurement.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_a2a_production_law_dependence_remeasurement.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_a2a_production_law_dependence_remeasurement.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_a2a_production_law_dependence_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_b1_corpus_tail_model.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_b1_corpus_tail_model.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_b1_corpus_tail_model.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_b1_corpus_tail_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_b1_corpus_tail_panel_producer.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_b1_corpus_tail_shadow_transport.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_b1_authoritative_settlement.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_b1_corpus_tail_shadow.sh
        docker run --rm "$$IMG" \
          python scripts/run_atlas_minimal_world_selection_c.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_a7_select_ladder.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_a7_production_law_transfer.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/freeze_a7_production_law_transfer.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_a7_production_law_transfer.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_a7_production_law_transfer.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_a7_production_law_transfer_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_corpus_retrieval_transport.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/run_corpus_retrieval_transport.py parked | \
          grep -F 'CORPUS_RETRIEVAL_PARKED default_off=true client_constructed=false' >/dev/null
        docker run --rm "$$IMG" \
          python -c 'import nfl_dfs.research.corpus_retrieval_engine as e; assert e.DEFAULT_ENTRY_BUDGET == 80'
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_corpus_retrieval_v1_reuse.sh
        docker run --rm "$$IMG" \
          python scripts/freeze_a7_select_ladder.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_a7_select_ladder.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_a7_select_ladder.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_a7_select_ladder_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_lr8_training_source.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_lr8_training_source_smoke.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_lr8_training_source_smoke.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_lr8_training_source_smoke_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_lr8_full_source_shards.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/finish_lr8_full_source_shards.py --help >/dev/null
        docker run --rm "$$IMG" \
          bash -n scripts/cloud_lr8_full_source_shards.sh
        docker run --rm "$$IMG" \
          bash -n scripts/watch_lr8_full_source_shards_queue.sh
        docker run --rm "$$IMG" \
          python scripts/run_lr8_label_score_map.py --help >/dev/null
        docker run --rm "$$IMG" \
          python scripts/publish_week1_operating_book.py --help >/dev/null
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:cloud-validated
  _CODE_SHA: unknown
timeout: 10800s
options:
  machineType: E2_HIGHCPU_8
