[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-dfs"
version = "0.1.0"
description = "DraftKings NFL DFS prediction and lineup-construction system on free data and Google Cloud"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "pulp>=2.7",
    "networkx>=3.2",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.13",
    "google-cloud-bigquery-storage>=2.24",
    "pandas-gbq>=0.26.1",  # future BQ client versions delegate DataFrame loads to this
    "google-cloud-storage>=2.13",
    "nflreadpy>=0.1",
    "polars>=0.20",
]
app = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
]
tuning = [
    "optuna>=3.4",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",  # FastAPI TestClient
]

[project.scripts]
nfl-dfs = "nfl_dfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PuLP 3.x deprecates direct LpVariable construction ahead of 4.0; the
    # classic API is intentional here and still supported.
    "ignore:Constructing LpVariable:DeprecationWarning",
    "ignore:.*PULP_CBC_CMD:DeprecationWarning",
]
