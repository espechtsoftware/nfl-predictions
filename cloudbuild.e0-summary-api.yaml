# Focused immutable release gate for the bounded E0 aggregate API.
#
# This build does not run an experiment or alter scoring. Submit it only from
# an exact pushed Git revision and deploy the resulting immutable digest with
# CORPUS_R6_HISTORICAL_REALIZED_SUMMARY_PATH pointing at the baked artifact.
steps:
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_IMAGE}'
      - .
  - name: gcr.io/cloud-builders/docker
    id: e0-summary-image-smoke
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm \
          -e CORPUS_R6_HISTORICAL_REALIZED_SUMMARY_PATH=/app/reports/2026-09-02-r6-historical-realized-summary-v1.json \
          '${_IMAGE}' python -c \
          "import hashlib; from pathlib import Path; from nfl_dfs.app.historical_corpus_research import FileHistoricalRealizedSummaryReader, first_observed_absence_query, strategy_rescue_query; from nfl_dfs.app.main import app; artifact=Path('/app/reports/2026-09-02-r6-historical-realized-summary-v1.json'); assert hashlib.sha256(artifact.read_bytes()).hexdigest()=='ad348254d5aee023b7864ffb10ef4f70d4c3e4a415b3a097d8ea53ea9d1f94eb'; value=FileHistoricalRealizedSummaryReader.from_environment().read(); assert value['summary_sha256']=='c5bd768eda8b4211a5ebe7aa48138246b3d659f94cb7c0981cc1fb578034d856'; assert first_observed_absence_query(value)['outcome_funnel_summary']['first_observed_absence_count']==241; assert strategy_rescue_query(value,strategy_id='coverage-194-v1')['row_count']==1; paths=set(app.openapi()['paths']); assert {'/api/corpus-research/historical-realized-summary','/api/corpus-research/historical-realized-summary/first-observed-absence','/api/corpus-research/historical-realized-summary/rescue'} <= paths"
images:
  - '${_IMAGE}'
substitutions:
  _CODE_SHA: unknown
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:e0-summary
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
