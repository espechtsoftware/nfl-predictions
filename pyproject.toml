[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-dfs"
version = "0.1.0"
description = "DraftKings NFL DFS prediction and lineup-construction system on free data and Google Cloud"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "pulp==3.3.2",
    "networkx>=3.2",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.13",
    "google-cloud-bigquery-storage>=2.24",
    "pandas-gbq>=0.26.1",  # future BQ client versions delegate DataFrame loads to this
    "google-cloud-storage>=2.13",
    "nflreadpy>=0.1",
    "polars>=0.20",
]
app = [
    "anthropic>=0.40",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-multipart>=0.0.9",
]
graph = [
    "neo4j==6.2.0",
]
browser = [
    "playwright>=1.49,<2",
]
tuning = [
    "optuna>=3.4",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",  # FastAPI TestClient
    "PyYAML>=6.0",  # validates committed Cloud Build contracts
]

[project.scripts]
nfl-dfs = "nfl_dfs.cli:main"
fantasy-points-download = "nfl_dfs.ops.fantasy_points_downloads:main"
fantasy-points-matchups = "nfl_dfs.ops.fantasy_points_matchups:main"
fantasy-points-ownership = "nfl_dfs.ops.fantasy_points_ownership:main"
sis-download = "nfl_dfs.ops.sis_downloads:main"
nfl-weekly-data = "nfl_dfs.ops.weekly_vendor_data:main"

[tool.setuptools.package-data]
"nfl_dfs.app" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cloud builds run `PYTHONPATH=src pytest`; pytest still adds the repository
# root so tests can import the repo-level `scripts` namespace.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # PuLP 3.x deprecates direct LpVariable construction ahead of 4.0; the
    # classic API is intentional here and still supported.
    "ignore:Constructing LpVariable:DeprecationWarning",
    "ignore:.*PULP_CBC_CMD:DeprecationWarning",
]
