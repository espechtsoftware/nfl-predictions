timeout: 3600s

options:
  machineType: E2_HIGHCPU_8

steps:
  - id: full-test-suite
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        pip install --no-cache-dir '.[gcp,dev]'
        PYTHONDONTWRITEBYTECODE=1 python -m py_compile \
          scripts/run_recourse_aware_initial_scorefree.py \
          scripts/aggregate_recourse_aware_initial_scorefree.py \
          scripts/run_recourse_aware_initial_single_job_transport.py \
          scripts/validate_recourse_aware_initial_canary.py
        PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. pytest -q -o addopts='' \
          tests/test_recourse_aware_initial_execution.py \
          tests/test_recourse_aware_initial_single_job_transport.py

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', .]

  - id: smoke-atlas-mvp-runner
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network=none '${_IMAGE}' \
          python scripts/run_recourse_aware_initial_scorefree.py --help >/dev/null
        docker run --rm --network=none '${_IMAGE}' \
          python scripts/aggregate_recourse_aware_initial_scorefree.py --help >/dev/null
        docker run --rm --network=none '${_IMAGE}' \
          python scripts/validate_recourse_aware_initial_canary.py --help >/dev/null

images:
  - '${_IMAGE}'
