# Bounded immutable build for the matched K=1 allocation experiment.  The
# build runs only the two directly owned focused suites; it does not launch or
# read any historical outcome artifact.
steps:
  - name: python:3.14.4-slim
    id: focused-boom-first-tests
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        pip install --no-cache-dir 'numpy==2.5.1' 'scipy==1.18.0'
        pip install --no-cache-dir '.[gcp,app,graph,dev]'
        PYTHONPATH=src python -m pytest -q \
          tests/test_corpus_r6_boom_first_allocation_v1.py
        PYTHONPATH=src python -m pytest -q \
          tests/test_run_corpus_r6_boom_first_allocation_v1.py
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -f
      - Dockerfile.corpus-r6-boom-first-allocation
      - -t
      - '${_IMAGE}'
      - --build-arg
      - 'SOURCE_COMMIT=${_SOURCE_COMMIT}'
      - .
  - name: gcr.io/cloud-builders/docker
    id: isolated-boom-first-runtime-smoke
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none '${_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_boom_first_allocation_v1.py --help
        docker run --rm --network none '${_IMAGE}' \
          /usr/local/bin/python3.11 -I -c \
          'import numpy, scipy; assert numpy.__version__ == "2.5.1"; assert scipy.__version__ == "1.18.0"; from nfl_dfs.research import corpus_r6_boom_first_allocation_v1 as b; assert b.TASK_COUNT == 54'
        docker run --rm --network none '${_IMAGE}' \
          /usr/local/bin/python3.11 -I -c \
          'import pulp; p=pulp.LpProblem("smoke",pulp.LpMaximize); x=pulp.LpVariable("x",cat="Binary"); p += x; p += x <= 1; p.solve(pulp.PULP_CBC_CMD(msg=False)); assert pulp.LpStatus[p.status] == "Optimal" and x.value() == 1'
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:corpus-r6-boom-first-allocation
  _SOURCE_COMMIT: MUST_SET_EXACT_40_HEX_SOURCE_COMMIT
timeout: 3600s
options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8
