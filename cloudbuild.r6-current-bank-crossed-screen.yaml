path'] == '/app/scripts/run_corpus_r6_current_bank_selector_rank150_dpp_v1.py'; assert se.process_spec_v1(se.MODE_EVALUATE)['entrypoint_path'] == '/app/scripts/run_corpus_r6_current_bank_selector_successor_evaluation_cloud_v1.py'; assert rb.cloud_entrypoint_registration_v1()['command'] == list(rb.ENTRYPOINT_COMMAND); assert h.ENTRYPOINT_COMMAND == ('/usr/local/bin/python3.11','-I','/app/scripts/run_corpus_extreme_tail_hard230_r6_cloud_v1.py','execute-task'); assert hc.CONTROLLER_ENTRYPOINT_COMMAND == ('/usr/local/bin/python3.11','-I','/app/scripts/run_corpus_extreme_tail_hard230_r6_cloud_v1.py','execute-controller-task'); assert pg.DISPATCHER_COMMAND == ('/usr/local/bin/python3.11','-I','/app/scripts/run_corpus_r6_population_challenger_v1.py','task'); assert p.DISPATCHER_COMMAND == ('/usr/local/bin/python3.11','-I','/app/scripts/run_corpus_r6_population_crossed_cloud_v1.py','task'); assert l2.ENTRYPOINT_COMMAND == ('/usr/local/bin/python3.11','-I','/app/scripts/run_corpus_r6_l2b_panel_cloud_v1.py','execute-task'); assert all((root/path).is_file() for path in (sc.DISPATCHER_RELATIVE_PATH, 'scripts/run_corpus_r6_current_bank_selector_successor_evaluation_cloud_v1.py', 'scripts/run_corpus_r6_current_bank_selector_successor_v1.py', 'scripts/run_corpus_r6_current_bank_selector_rank150_dpp_v1.py', rb.ENTRYPOINT_RELATIVE_PATH, h.ENTRYPOINT_RELATIVE_PATH, pg.DISPATCHER_RELATIVE_PATH, p.DISPATCHER_RELATIVE_PATH, l2.ENTRYPOINT_RELATIVE_PATH, 'scripts/run_corpus_r6_l2b_selector_adapter_v1.py'))"
        set +e
        help_output="$$(docker run --rm --network=none '${_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_current_bank_crossed_screen_task_dispatcher_v1.py \
          --help 2>&1)"
        help_status="$$?"
        closed_output="$$(docker run --rm --network=none '${_IMAGE}' 2>&1)"
        closed_status="$$?"
        set -e
        test "$$help_status" -eq 1
        test "$$closed_status" -eq 1
        case "$$help_output" in
          *"task dispatcher failed closed: dispatcher kernel command token count differs"*) ;;
          *) printf '%s\n' "$$help_output" >&2; exit 1 ;;
        esac
        case "$$closed_output" in
          *"task dispatcher failed closed: dispatcher requires exact R6_CURRENT_BANK_TASK_DISPATCH_ENABLED=1"*) ;;
          *) printf '%s\n' "$$closed_output" >&2; exit 1 ;;
        esac

