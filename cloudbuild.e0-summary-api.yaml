# Focused immutable release gate for the bounded E0 aggregate API.
#
# This build does not run an experiment or alter scoring. Submit it only from
# an exact pushed Git revision and deploy the resulting immutable digest with
# CORPUS_R6_HISTORICAL_REALIZED_SUMMARY_PATH pointing at the baked artifact.
steps:
  - name: python:3.11-slim
    id: focused-e0-summary-tests
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        pip install --no-cache-dir '.[gcp,app,dev]'
        PYTHONPATH=src python -m pytest -q \
          tests/test_corpus_r6_historical_realized_summary_v1.py \
          tests/test_run_corpus_r6_historical_realized_summary_v1.py \
          tests/test_historical_corpus_research_api.py
        test "$(sha256sum reports/2026-09-02-r6-historical-realized-summary-v1.json | cut -d' ' -f1)" = \
          ad348254d5aee023b7864ffb10ef4f70d4c3e4a415b3a097d8ea53ea9d1f94eb
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_IMAGE}'
      - .
  - name: gcr.io/cloud-builders/docker
    id: e0-summary-image-smoke
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm \
          -e CORPUS_R6_HISTORICAL_REALIZED_SUMMARY_PATH=/app/reports/2026-09-02-r6-historical-realized-summary-v1.json \
          '${_IMAGE}' python -c \
          "from nfl_dfs.app.historical_corpus_research import FileHistoricalRealizedSummaryReader, first_observed_absence_query, strategy_rescue_query; from nfl_dfs.app.main import app; value=FileHistoricalRealizedSummaryReader.from_environment().read(); assert value['summary_sha256']=='c5bd768eda8b4211a5ebe7aa48138246b3d659f94cb7c0981cc1fb578034d856'; assert first_observed_absence_query(value)['outcome_funnel_summary']['first_observed_absence_count']==241; assert strategy_rescue_query(value,strategy_id='coverage-194-v1')['row_count']==1; paths={getattr(route,'path',None) for route in app.routes}; assert {'/api/corpus-research/historical-realized-summary','/api/corpus-research/historical-realized-summary/first-observed-absence','/api/corpus-research/historical-realized-summary/rescue'} <= paths"
images:
  - '${_IMAGE}'
substitutions:
  _CODE_SHA: unknown
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:e0-summary
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
