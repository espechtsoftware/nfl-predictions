# Immutable, outcome-blind build for the seven-pack capture operator.
timeout: 3600s

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  - id: prepare-seven-pack-release
    name: python:3.14.4-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' '${_CODE_SHA}' | grep -Eq '^[0-9a-f]{40}$'
        case '${_BUILD_IMAGE}' in
          *:matchup-seven-pack-'${_CODE_SHA}') ;;
          *) echo 'build image tag must bind the full source commit' >&2; exit 2 ;;
        esac
        test ! -e release
        mkdir release
        cp -a --parents \
          Dockerfile.corpus-r6-matchup-seven-pack-capture \
          Dockerfile.corpus-r6-matchup-seven-pack-capture.dockerignore \
          cloudbuild.corpus-r6-matchup-seven-pack-capture.yaml \
          pyproject.toml README.md src \
          scripts/cloud_corpus_r6_matchup_seven_pack_capture_v1.sh \
          scripts/run_corpus_r6_matchup_seven_pack_capture_v1.py \
          tests/test_corpus_r6_matchup_seven_pack_capture_v1.py \
          tests/test_corpus_r6_matchup_seven_pack_capture_operator_v1.py \
          tests/test_corpus_r6_matchup_capture_plan_from_seven_pack_v1.py \
          tests/test_cloud_corpus_r6_matchup_seven_pack_capture_v1.py \
          release/
        printf '%s\n' '${_CODE_SHA}' >release/SOURCE_COMMIT
        test ! -e release/.git
        test ! -e release/reports
        test ! -e release/sql
        test ! -e release/HANDOFF.md
        test ! -e release/CLAUDE.md

  - id: build-implementation-authority-and-test
    name: python:3.14.4-slim
    dir: release
    entrypoint: bash
    args:
      - -ceu
      - |
        ln -s /usr/local/bin/python3.14 /usr/local/bin/python3.11
        pip install --no-cache-dir \
          'numpy==2.5.1' 'scipy==1.18.0' 'scikit-learn==1.9.0' \
          'pulp==3.3.2'
        pip install --no-cache-dir --no-deps --editable .
        pip install --no-cache-dir 'pytest==9.1.1' 'PyYAML==6.0.3'
        /usr/local/bin/python3.11 -I \
          scripts/run_corpus_r6_matchup_seven_pack_capture_v1.py \
          build-implementation-authority --repository-root "$$PWD" \
          --source-commit-sha '${_CODE_SHA}' \
          >SEVEN_PACK_IMPLEMENTATION_AUTHORITY.json
        authority_sha=$(sha256sum SEVEN_PACK_IMPLEMENTATION_AUTHORITY.json | awk '{print $1}')
        test "$authority_sha" = '${_IMPLEMENTATION_AUTHORITY_SHA}'
        bash -n scripts/cloud_corpus_r6_matchup_seven_pack_capture_v1.sh
        PYTHONDONTWRITEBYTECODE=1 python -m py_compile \
          src/nfl_dfs/research/corpus_r6_matchup_seven_pack_capture_v1.py \
          src/nfl_dfs/research/corpus_r6_matchup_seven_pack_capture_operator_v1.py \
          src/nfl_dfs/research/corpus_r6_matchup_capture_plan_from_seven_pack_v1.py \
          scripts/run_corpus_r6_matchup_seven_pack_capture_v1.py
        PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q -o addopts='' \
          tests/test_corpus_r6_matchup_seven_pack_capture_v1.py \
          tests/test_corpus_r6_matchup_seven_pack_capture_operator_v1.py \
          tests/test_corpus_r6_matchup_capture_plan_from_seven_pack_v1.py \
          tests/test_cloud_corpus_r6_matchup_seven_pack_capture_v1.py

  - id: build-seven-pack-image
    name: gcr.io/cloud-builders/docker
    dir: release
    args:
      - build
      - --pull
      - --file
      - Dockerfile.corpus-r6-matchup-seven-pack-capture
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - --build-arg
      - 'IMPLEMENTATION_AUTHORITY_SHA256=${_IMPLEMENTATION_AUTHORITY_SHA}'
      - -t
      - '${_BUILD_IMAGE}'
      - .

  - id: isolated-seven-pack-runtime-smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /bin/bash /app/scripts/cloud_corpus_r6_matchup_seven_pack_capture_v1.sh \
          container-help >/dev/null

images:
  - '${_BUILD_IMAGE}'

substitutions:
  _BUILD_IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:matchup-seven-pack-unknown
  _CODE_SHA: unknown
  _IMPLEMENTATION_AUTHORITY_SHA: unknown
