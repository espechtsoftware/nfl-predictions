# Narrow live lane for the image `project-slate` actually runs (Dockerfile.week1-live).
# Use THIS lane, not cloudbuild.yaml: the full-suite config timed out at its 3-hour
# ceiling on 2026-09-15 (build 2a28b013, defect 17) and has not completed since, while
# this lane built the deployed image in under six minutes (build d7089008, 2026-09-19).
# Running it is a disclosed deviation from "image only after the complete suite":
# record the build id in HANDOFF. 2026-09-21: the six market-repair modules were added
# so the props-or-nothing contract and the frozen inventory hashes are verified inside
# the build that produces the image carrying them.
steps:
  - name: python:3.11-slim
    id: live-boundary-tests
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends libgomp1
        pip install --no-cache-dir '.[gcp,app,dev]'
        PYTHONPATH=src pytest \
          tests/test_week1_source_readiness.py \
          tests/test_live_smoke.py \
          tests/test_live_multiseed.py \
          tests/test_blend_coldstart.py \
          tests/test_cbwu_oi_shadow.py \
          tests/test_multiseed_portfolio.py \
          tests/test_recourse_worlds.py \
          tests/test_production_policy.py \
          tests/test_week1_participation_mixture.py \
          tests/test_week1_adopted_pair.py \
          tests/test_week1_operating_book.py \
          tests/test_market_source.py \
          tests/test_prop_market_ambiguity.py \
          tests/test_market_monitor.py \
          tests/test_build_inputs.py \
          tests/test_week_build_gate.py \
          tests/test_player_score_week_resolution.py \
          tests/test_money_path_slice_arguments.py \
          tests/test_exposure_sheet.py \
          tests/test_effective_policy_rule_inventory.py
        python -Werror::SyntaxWarning -m compileall -q src

  - name: gcr.io/cloud-builders/docker
    id: build-live-image
    args:
      - build
      - --file
      - Dockerfile.week1-live
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - --tag
      - '${_IMAGE}'
      - .

  - name: gcr.io/cloud-builders/docker
    id: smoke-live-image
    entrypoint: bash
    env:
      - 'IMG=${_IMAGE}'
      - 'CODE_SHA=${_CODE_SHA}'
    args:
      - -ceu
      - |
        docker run --rm "$$IMG" nfl-dfs --help >/dev/null
        docker run --rm "$$IMG" python -c \
          'import os; from nfl_dfs.features import build; from nfl_dfs.inference import run_projections; assert os.environ["IMAGE_SOURCE_COMMIT_SHA"]'
        test "$$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$$IMG")" = "$$CODE_SHA"

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:week1-live
  _CODE_SHA: unknown

timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
