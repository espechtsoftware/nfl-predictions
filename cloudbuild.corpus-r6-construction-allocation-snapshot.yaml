# Immutable build for the construction-preset x allocation snapshot-shard
# cohort.  This build has no cloud experiment mutation and reads no outcome.
timeout: 3600s

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  - id: prepare-outcome-blind-release-context
    name: python:3.14.4-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' '${_CODE_SHA}' | grep -Eq '^[0-9a-f]{40}$'
        test ! -e release
        mkdir release
        cp -a --parents \
          Dockerfile.corpus-r6-construction-allocation-snapshot \
          cloudbuild.corpus-r6-construction-allocation-snapshot.yaml \
          pyproject.toml README.md src \
          scripts/cloud_corpus_r6_construction_allocation_snapshot_v1.sh \
          scripts/run_corpus_r6_construction_allocation_grade_v1.py \
          scripts/run_corpus_r6_construction_allocation_snapshot_shard_v1.py \
          tests/conftest.py \
          tests/test_boom_first_historical_construction_snapshot_adapter_v1.py \
          tests/test_corpus_r6_construction_allocation_cloud_release_v1.py \
          tests/test_corpus_r6_construction_allocation_cross_v1.py \
          tests/test_corpus_r6_construction_allocation_grade_operator_v1.py \
          tests/test_corpus_r6_construction_allocation_operator_hardening_v1.py \
          tests/test_corpus_r6_construction_allocation_shard_v1.py \
          tests/test_run_corpus_r6_construction_allocation_grade_v1.py \
          tests/test_run_corpus_r6_construction_allocation_snapshot_shard_v1.py \
          release/
        printf '%s\n' '${_CODE_SHA}' >release/SOURCE_COMMIT
        test ! -e release/.git
        test ! -e release/reports
        test ! -e release/sql
        test ! -e release/HANDOFF.md
        test ! -e release/CLAUDE.md

  - id: construction-allocation-release-tests
    name: python:3.14.4-slim
    dir: release
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' '${_CODE_SHA}' | grep -Eq '^[0-9a-f]{40}$'
        case '${_BUILD_IMAGE}' in
          *:construction-allocation-'${_CODE_SHA}') ;;
          *) echo 'build image tag must bind the full source commit' >&2; exit 2 ;;
        esac
        test ! -e .git
        test ! -e reports
        test ! -e sql
        test ! -e HANDOFF.md
        test ! -e CLAUDE.md
        test "$(cat SOURCE_COMMIT)" = '${_CODE_SHA}'
        test "$(find scripts -type f | sort)" = "$(printf '%s\n' \
          scripts/cloud_corpus_r6_construction_allocation_snapshot_v1.sh \
          scripts/run_corpus_r6_construction_allocation_grade_v1.py \
          scripts/run_corpus_r6_construction_allocation_snapshot_shard_v1.py | sort)"
        test -f scripts/run_corpus_r6_construction_allocation_snapshot_shard_v1.py
        test -f scripts/run_corpus_r6_construction_allocation_grade_v1.py
        test -f src/nfl_dfs/research/corpus_r6_construction_allocation_grade_v1.py
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        pip install --no-cache-dir 'numpy==2.5.1' 'scipy==1.18.0'
        pip install --no-cache-dir '.[gcp,dev]'
        bash -n scripts/cloud_corpus_r6_construction_allocation_snapshot_v1.sh
        PYTHONDONTWRITEBYTECODE=1 python -m compileall -q \
          scripts/run_corpus_r6_construction_allocation_snapshot_shard_v1.py \
          src/nfl_dfs/research/boom_first_historical_construction_snapshot_adapter_v1.py \
          src/nfl_dfs/research/corpus_r6_construction_allocation_cross_v1.py \
          src/nfl_dfs/research/corpus_r6_construction_allocation_cross_operator_v1.py \
          src/nfl_dfs/research/corpus_r6_construction_allocation_grade_operator_v1.py \
          src/nfl_dfs/research/corpus_r6_construction_allocation_grade_v1.py \
          src/nfl_dfs/research/corpus_r6_construction_allocation_shard_v1.py \
          scripts/run_corpus_r6_construction_allocation_grade_v1.py
        PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q -o addopts='' \
          tests/test_boom_first_historical_construction_snapshot_adapter_v1.py \
          tests/test_corpus_r6_construction_allocation_cross_v1.py \
          tests/test_corpus_r6_construction_allocation_grade_operator_v1.py \
          tests/test_corpus_r6_construction_allocation_operator_hardening_v1.py \
          tests/test_corpus_r6_construction_allocation_shard_v1.py \
          tests/test_run_corpus_r6_construction_allocation_grade_v1.py \
          tests/test_run_corpus_r6_construction_allocation_snapshot_shard_v1.py \
          tests/test_corpus_r6_construction_allocation_cloud_release_v1.py

  - id: build-construction-allocation-image
    name: gcr.io/cloud-builders/docker
    dir: release
    args:
      - build
      - --pull
      - --file
      - Dockerfile.corpus-r6-construction-allocation-snapshot
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_BUILD_IMAGE}'
      - .

  - id: isolated-construction-allocation-runtime-smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_construction_allocation_snapshot_shard_v1.py \
          --help >/dev/null
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_construction_allocation_grade_v1.py \
          --help >/dev/null
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /bin/bash /app/scripts/cloud_corpus_r6_construction_allocation_snapshot_v1.sh \
          container-help >/dev/null
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /usr/local/bin/python3.11 -I -c \
          'from nfl_dfs.research import corpus_r6_construction_allocation_grade_operator_v1 as g; from nfl_dfs.research import corpus_r6_construction_allocation_cross_operator_v1 as o; assert callable(g.prepare_grade_manifest_v1) and callable(g.publish_grade_v1) and callable(g.reopen_grade_terminal_v1) and callable(o.reopen_terminal_bundle_v1)'
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /bin/bash -ceu 'command -v gcloud >/dev/null; test "$IMAGE_SOURCE_COMMIT_SHA" = "${_CODE_SHA}"'

images:
  - '${_BUILD_IMAGE}'

substitutions:
  _BUILD_IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:construction-allocation-unknown
  _CODE_SHA: unknown
