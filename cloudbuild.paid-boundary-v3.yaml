# Immutable source-authenticated release gate for the paid Classic v3 boundary.
# The submitted workstation context is never the image source: every image byte
# is fetched from and checked against the exact pushed commit.
steps:
  - name: gcr.io/cloud-builders/git
    id: prepare-exact-clean-source
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' '${_CODE_SHA}' | grep -Eq '^[0-9a-f]{40}$'
        case '${_BUILD_IMAGE}' in
          *:paid-v3-'${_CODE_SHA}') ;;
          *) echo 'build image tag must bind the full source commit' >&2; exit 2 ;;
        esac
        test ! -e release
        git init release
        git -C release remote add origin https://github.com/espechtsoftware/nfl-predictions.git
        git -C release fetch --no-tags origin '${_CODE_SHA}'
        git -C release checkout --detach '${_CODE_SHA}'
        test "$(git -C release rev-parse HEAD)" = '${_CODE_SHA}'
        test "$(git -C release rev-parse --is-shallow-repository)" = false
        test -z "$(git -C release status --porcelain --untracked-files=all)"

  - name: python:3.11-slim
    id: focused-production-boundary-tests
    dir: release
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        rm -rf /var/lib/apt/lists/*
        pip install --no-cache-dir '.[gcp,app,dev]'
        export PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src
        python -m pytest -q -o addopts='' -p no:cacheprovider \
          tests/test_canonical_game_policy_v2.py \
          tests/test_winner_registry_v2.py \
          tests/test_paid_classic_book_v2.py \
          tests/test_paid_classic_book_v3.py \
          tests/test_paid_classic_deployment_v3.py \
          tests/test_paid_v3_authority_readiness.py \
          tests/test_week1_operating_book_export.py \
          tests/test_week1_operating_book_api.py \
          tests/test_contest_capture_rehearsal.py \
          tests/test_dk_paid_freshness_scheduler_contract.py \
          tests/test_optimizer.py \
          tests/test_export_entries.py \
          tests/test_ownership_import.py \
          tests/test_dk_standings_capture.py
        python scripts/build_winner_registry_v2.py --check
        test "$(git rev-parse HEAD)" = '${_CODE_SHA}'
        test -z "$(git status --porcelain --untracked-files=all)"

  - name: gcr.io/cloud-builders/docker
    id: build-image-from-exact-source
    dir: release
    args:
      - build
      - --pull
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_BUILD_IMAGE}'
      - .

  - name: gcr.io/cloud-builders/docker
    id: paid-boundary-image-smoke
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none '${_BUILD_IMAGE}' python -c \
          "from nfl_dfs.app.main import app; paths={getattr(r,'path',None) for r in app.routes}; assert {'/lineups/paid-v2','/lineups/paid-v2.csv','/lineups/entries/paid-v2.csv','/lineups/paid-v3','/lineups/paid-v3.csv','/lineups/entries/paid-v3.csv'} <= paths"
        docker run --rm --network none '${_BUILD_IMAGE}' python -c \
          "from nfl_dfs.optimizer.paid_classic_book_v2 import PAID_CLASSIC_BOUNDARY_ID as V2; from nfl_dfs.optimizer.paid_classic_book_v3 import PAID_CLASSIC_BOUNDARY_ID as V3; assert V2 == 'paid-classic-book-boundary-v2'; assert V3 == 'paid-classic-book-boundary-v3-canonical-game'"
        docker run --rm --network none -e EXPECTED_SOURCE_COMMIT='${_CODE_SHA}' '${_BUILD_IMAGE}' \
          python -c \
          'import os; assert os.environ["IMAGE_SOURCE_COMMIT_SHA"] == os.environ["EXPECTED_SOURCE_COMMIT"]'
        docker run --rm --network none '${_BUILD_IMAGE}' python -c \
          "import json; from nfl_dfs.ops.paid_v3_authority_readiness import assert_storage_api_support_v1; print(json.dumps(assert_storage_api_support_v1(), sort_keys=True))"

images:
  - '${_BUILD_IMAGE}'
substitutions:
  _CODE_SHA: unknown
  _BUILD_IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:paid-v3-unknown
timeout: 3600s
queueTtl: 3600s
serviceAccount: projects/nfl-predictions-503414/serviceAccounts/817589974517-compute@developer.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
