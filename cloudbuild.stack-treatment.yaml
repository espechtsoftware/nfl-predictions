# Outcome-free immutable validation/image path for the support-gated
# stack-core/shell treatment and its separately locked historical scorer.
steps:
  - name: python:3.11-slim
    id: full-test-suite
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends libgomp1
        pip install --no-cache-dir '.[gcp,app,dev]'
        PYTHONPATH=. pytest
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args: [build, -f, Dockerfile.stack-treatment, -t, '${_IMAGE}', .]
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-source-loader
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python -c 'import sys; sys.path.insert(0,"scripts"); import stack_core_shell_sources as s; s.validate_local_sources()'
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-scorefree-runner
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python scripts/run_stack_core_shell_scorefree.py --help >/dev/null
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-scorefree-aggregator
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python scripts/aggregate_stack_core_shell_scorefree.py --help >/dev/null
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-lock-runner
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python scripts/run_stack_core_shell_production_lock.py --help >/dev/null
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-lock-aggregator
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python scripts/aggregate_stack_core_shell_production_locks.py --help >/dev/null
  - name: gcr.io/cloud-builders/docker
    id: smoke-stack-core-shell-historical-scorer
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm '${_IMAGE}' \
          python scripts/run_stack_core_shell_historical_score.py --help >/dev/null
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:stack-shell-treatment-validated
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
