# Immutable Commit-B image for task0 worker, distinct verifier, and full source-v3.
timeout: 3600s

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  - id: prepare-exact-clean-commit-b
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s' '${_CODE_SHA}' | grep -Eq '^[0-9a-f]{40}$'
        case '${_BUILD_IMAGE}' in
          *:matchup-source-v3-'${_CODE_SHA}') ;;
          *) echo 'build image tag must bind full Commit B' >&2; exit 2 ;;
        esac
        test ! -e release
        git init release
        git -C release remote add origin https://github.com/espechtsoftware/nfl-predictions.git
        git -C release fetch --no-tags origin '${_CODE_SHA}'
        git -C release checkout --detach '${_CODE_SHA}'
        test "$(git -C release rev-parse HEAD)" = '${_CODE_SHA}'
        test "$(git -C release rev-parse --is-shallow-repository)" = false
        test -z "$(git -C release status --porcelain --untracked-files=all)"

  - id: focused-commit-b-validation
    name: python:3.11-slim
    dir: release
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends git libgomp1
        rm -rf /var/lib/apt/lists/*
        pip install --no-cache-dir --editable '.[gcp]' \
          'pytest==9.1.1' 'google-cloud-storage==3.13.1'
        export PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src PYTHONPYCACHEPREFIX=/tmp/source-v3-pycache
        bash -n scripts/cloud_corpus_r6_matchup_source_task0_v3.sh
        python -m py_compile \
          src/nfl_dfs/research/corpus_r6_matchup_component_producer_v1.py \
          src/nfl_dfs/research/corpus_r6_matchup_source_task0_v3.py \
          src/nfl_dfs/research/corpus_r6_matchup_source_batch_outer_candidate_authority_v3.py \
          scripts/run_corpus_r6_matchup_source_task0_v3.py \
          scripts/run_corpus_r6_matchup_source_batch_v3.py
        python -m pytest -q -o addopts='' -p no:cacheprovider \
          tests/test_corpus_r6_matchup_component_producer_v1.py::test_one_task_gate_runs_production_reducer_for_only_ordinal_zero \
          tests/test_corpus_r6_matchup_source_task0_v3.py \
          tests/test_run_corpus_r6_matchup_source_task0_v3.py \
          tests/test_run_corpus_r6_matchup_source_batch_v3.py \
          tests/test_cloud_corpus_r6_matchup_source_task0_v3.py
        python -I -c 'from nfl_dfs.research import corpus_r6_matchup_source_batch_outer_candidate_authority_v3 as batch; closure=batch._trusted_dependency_closure_v3(); batch._trusted_capture_plan_v3(dependency_closure=closure)'
        test -z "$(git status --porcelain --untracked-files=all)"

  - id: build-commit-b-image
    name: gcr.io/cloud-builders/docker
    dir: release
    args:
      - build
      - --pull
      - --file
      - Dockerfile.corpus-r6-matchup-source-v3
      - --build-arg
      - 'SOURCE_COMMIT_SHA=${_CODE_SHA}'
      - -t
      - '${_BUILD_IMAGE}'
      - .

  - id: isolated-controller-smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /bin/bash /app/scripts/cloud_corpus_r6_matchup_source_task0_v3.sh \
          container-help >/dev/null
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_matchup_source_task0_v3.py \
          --help >/dev/null
        docker run --rm --network none '${_BUILD_IMAGE}' \
          /usr/local/bin/python3.11 -I \
          /app/scripts/run_corpus_r6_matchup_source_batch_v3.py \
          --help >/dev/null

images:
  - '${_BUILD_IMAGE}'

substitutions:
  _BUILD_IMAGE: us-central1-docker.pkg.dev/nfl-predictions-503414/nfl-dfs/nfl-dfs:matchup-source-v3-unknown
  _CODE_SHA: unknown
